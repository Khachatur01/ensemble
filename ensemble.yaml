# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/ensemble.schema.json

# ensemble.yaml — the agent team, and what runs each member.
#
# The line above gives an editor with the YAML language server (VS Code's YAML
# extension, Neovim, Zed, JetBrains) completion, hover docs and error checking
# for every key. Offline, or to pin your version:
#   ensemble schema > ensemble.schema.json
# and point the line at that file instead.
#
# This is the shipped example. Copy it to your project root and edit the
# `roles` block; the backends are already pointed at the
# environment variables listed at the bottom.
#
# Validate it at any time with:   ensemble check

version: 1

# ---------------------------------------------------------------------------
# Backends — *how* a model is reached. Two types ship.
# ---------------------------------------------------------------------------
backends:
  # The official `claude` CLI, run as a subprocess on your own subscription.
  # Needs no environment: the login lives in Claude Code's own config and the
  # working directory comes from the session.
  claude:
    type: claude-code-cli
    # Optional. Defaults shown.
    # command: claude              # the binary, if it is not on PATH
    # allowed_tools: [Read, Grep, Glob]  # Claude Code's own tools it may run without asking
    # permission_mode: dontAsk
    # max_turns: 12
    # timeout_seconds: 600

  # Anything speaking POST /chat/completions — llama-server, vLLM, Ollama,
  # a hosted API.
  openai-local:
    type: openai-compatible-api
    base_url_env: OPENAI_LOCAL_BASE_URL
    base_url_default: "http://127.0.0.1:8000/v1"
    api_key_env: OPENAI_LOCAL_API_KEY

  openai-remote:
    type: openai-compatible-api
    base_url_env: OPENAI_REMOTE_BASE_URL
    base_url_default: "http://10.10.10.5:8000/v1"
    api_key_env: OPENAI_REMOTE_API_KEY

# ---------------------------------------------------------------------------
# There is no manager block. The agent that calls Ensemble over MCP (Claude
# Code, OpenCode, ...) is the manager: it sees the roles below as tools and
# decides what to delegate. Register it from the project directory with:
#
#   opencode mcp add ensemble -- ensemble mcp
#   claude mcp add --scope local ensemble -- ensemble mcp
#
# and tell it, in CLAUDE.md / AGENTS.md, which roles to use for what.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Agent roles — a role with `tools:` is an agent. Ensemble runs the tool loop
# itself, inside the project directory (fixed when the server starts; the model
# can name paths inside it and nothing else):
#
#   tools:     read, glob, grep, edit, write, bash, fetch
#                                              (edit, write and bash change
#                                               things, so a role gets them
#                                               only by name; bash is
#                                               sandboxed to write only in the
#                                               project and /tmp, and to read
#                                               only the project, the system
#                                               and toolchain directories;
#                                               fetch reads public web pages)
#   network:   false                           (bash may open outbound TCP)
#   readable:  [~/.m2]                         (more paths bash may read)
#   max_steps: 20                              (model calls per delegation)
#   max_seconds: 1800                          (wall-clock limit per delegation)
#   context_window: 16384                      (required: tokens of context the server runs the
#                                               model with; Ollama: OLLAMA_CONTEXT_LENGTH)
#
# No `tools:` means a think-only role: one model call, text back. Roles with
# tools need a backend with tool calling (openai-compatible-api).
#
# The team — entirely yours to name. These are a
# starting kit, not a fixed set: add, remove or rename freely.
#
# Moving a role to a different model is two words, and nothing else changes.
#
# Any role may also set `temperature: <0.0-2.0>` to
# override the backend's own default. Mainly for a server whose baked-in
# sampling is too hot for reliable tool calling (an Ollama Modelfile's
# `temperature`/`presence_penalty`, for instance) — `ensemble check` cannot
# see that, only a role that narrates calling a tool instead of calling it
# shows it.
# ---------------------------------------------------------------------------
roles:
  planner:
    backend: openai-local
    model: qwen3-coder
    prompt: |
      You turn a goal into an ordered plan of small, verifiable steps. State
      what you are unsure about rather than guessing.

  coder:
    backend: openai-remote
    model: qwen3-coder
    tools: [read, glob, grep, edit, write]
    context_window: 16384
    prompt: |
      You implement exactly what is asked, in the style of the surrounding
      code. Read the relevant files first, make the change, and report what
      you changed.

  reviewer:
    backend: openai-local
    model: qwen3-coder
    tools: [read, glob, grep]
    context_window: 16384
    prompt: |
      You review code for correctness and report findings. You do not rewrite
      it; you say what is wrong and where.

# ---------------------------------------------------------------------------
# Environment
#
#   OPENAI_LOCAL_BASE_URL    overrides base_url_default above
#   OPENAI_LOCAL_API_KEY     only if that server wants one
#   OPENAI_REMOTE_BASE_URL   overrides base_url_default above
#   OPENAI_REMOTE_API_KEY    only if that server wants one
#
# API keys are read from the environment and never from this file. A literal
# `api_key:` key is rejected at load time rather than ignored.
# ---------------------------------------------------------------------------
