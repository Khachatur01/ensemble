# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/ensemble.schema.json

# ensemble.yaml — the agent team, and what runs each member.
#
# The line above gives an editor with the YAML language server (VS Code's YAML
# extension, Neovim, Zed, JetBrains) completion, hover docs and error checking
# for every key. Offline, or to pin your version:
#   ensemble schema > ensemble.schema.json
# and point the line at that file instead.
#
# This is the shipped example. Copy it to your project root and edit the
# `agents` block; the LLM backends are already pointed at the environment
# variables listed at the bottom.
#
# Validate it at any time with:   ensemble check

version: 1

# ---------------------------------------------------------------------------
# LLM backends — model endpoints that Ensemble's own agents run on.
# ---------------------------------------------------------------------------
llm_backends:
  # Anything speaking POST /chat/completions — llama-server, vLLM, Ollama,
  # a hosted API.
  openai-local:
    type: openai-compatible-api
    base_url_env: OPENAI_LOCAL_BASE_URL
    base_url_default: "http://127.0.0.1:8000/v1"
    api_key_env: OPENAI_LOCAL_API_KEY

  openai-remote:
    type: openai-compatible-api
    base_url_env: OPENAI_REMOTE_BASE_URL
    base_url_default: "http://10.10.10.5:8000/v1"
    api_key_env: OPENAI_REMOTE_API_KEY

# ---------------------------------------------------------------------------
# There is no manager block. The agent that calls Ensemble over MCP (Claude
# Code, OpenCode, ...) is the manager: it sees the agents below as tools and
# decides what to delegate. Register it from the project directory with:
#
#   opencode mcp add ensemble -- ensemble mcp
#   claude mcp add --scope local ensemble -- ensemble mcp
#
# and tell it, in CLAUDE.md / AGENTS.md, which agents to use for what.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Agents — the team, entirely yours to name. These are a starting kit, not a
# fixed set: add, remove or rename freely.
#
# Each agent has:
#   prompt:          what it is for; its first line is what the manager sees
#   context_window:  required when the adapter has tools: tokens of context
#                    the server runs the model with (Ollama:
#                    OLLAMA_CONTEXT_LENGTH)
#   max_seconds:     wall-clock limit per delegation (default 1800)
#   adapter:         what runs it. `type` decides the other fields.
#
# The `ensemble` adapter is Ensemble's own harness, run on one of the LLM
# backends above, inside the project directory (fixed when the server starts;
# the model can name paths inside it and nothing else):
#   llm_backend, model     which endpoint and model
#   tools:                 read, glob, grep, edit, write, bash, fetch
#                          (edit, write and bash change things, so an agent
#                          gets them only by name; bash is sandboxed to write
#                          only in the project and /tmp, and to read only the
#                          project, the system and toolchain directories;
#                          fetch reads public web pages). No tools: one model
#                          call, text back.
#   network: false         bash may open outbound TCP
#   readable: [~/.m2]      more paths bash may read
#   max_steps: 20          model calls per delegation
#   temperature            overrides the model's default (0.0-2.0); for a
#                          server whose baked-in sampling is too hot for
#                          reliable tool calling
#   reasoning_effort       none, low, medium or high; `none` turns thinking off
#
# The `claude-code` adapter is the Claude Code CLI, run headless in the
# project on your own subscription. It needs no LLM backend and takes no
# context_window (Claude Code manages its own):
#   model                  sonnet, opus, haiku, or a full model id
#   tools                  Claude Code's own tools, one per entry, such as Read,
#                          Edit, Bash or Bash(git diff:*). Default: [Read, Grep,
#                          Glob], read-only
#   permission_mode        default dontAsk: anything not in tools is denied
#   max_turns              default 30
#   command                default claude
#
# Other adapters (OpenCode, Codex) will be further types.
# ---------------------------------------------------------------------------
agents:
  planner:
    prompt: |
      You turn a goal into an ordered plan of small, verifiable steps. State
      what you are unsure about rather than guessing.
    adapter:
      type: ensemble
      llm_backend: openai-local
      model: qwen3-coder

  coder:
    prompt: |
      You implement exactly what is asked, in the style of the surrounding
      code. Read the relevant files first, make the change, and report what
      you changed.
    context_window: 16384
    adapter:
      type: ensemble
      llm_backend: openai-remote
      model: qwen3-coder
      tools: [read, glob, grep, edit, write]

  reviewer:
    prompt: |
      You review code for correctness and report findings. You do not rewrite
      it; you say what is wrong and where.
    context_window: 16384
    adapter:
      type: ensemble
      llm_backend: openai-local
      model: qwen3-coder
      tools: [read, glob, grep]

  # A Claude Code agent. Uncomment if `claude` is installed and logged in.
  # architect:
  #   prompt: |
  #     You review a design or a change for structural problems and say what
  #     to do instead. You do not edit.
  #   adapter:
  #     type: claude-code
  #     model: sonnet

# ---------------------------------------------------------------------------
# Environment
#
#   OPENAI_LOCAL_BASE_URL    overrides base_url_default above
#   OPENAI_LOCAL_API_KEY     only if that server wants one
#   OPENAI_REMOTE_BASE_URL   overrides base_url_default above
#   OPENAI_REMOTE_API_KEY    only if that server wants one
#
# API keys are read from the environment and never from this file. A literal
# `api_key:` key is rejected at load time rather than ignored.
# ---------------------------------------------------------------------------
