# The hub's web UI, a component of its own: the hub knows nothing of it.
# `app` is the single-page app, built for WebAssembly (build.sh); `server` is
# `ensemble-ui`, which serves the app and passes its calls to the hub's REST
# API on, so the browser sees one origin.
[workspace]
members = ["app", "server"]
# `cargo build` builds the server; the app is built for wasm32 alone.
default-members = ["server"]
resolver = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
