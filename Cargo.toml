[package]
name = "ensemble"
version = "0.1.0"
edition = "2024"
description = "One interface for interacting with different models, delegating work between them."
license = "MIT"

[[bin]]
name = "ensemble"
path = "src/main.rs"

[dependencies]
# Config and wire formats. serde_norway is the maintained fork of serde_yaml,
# which upstream deprecated.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
# Blocking HTTP client for the OpenAI-compatible adapter. Chosen over reqwest so
# the whole program stays synchronous: no async runtime is pulled in for what is
# a handful of request/response round trips.
ureq = "3"

[dev-dependencies]
# Nothing. The test suites use the std harness and the fake backends in
# src/port.rs, so `cargo test` needs no network and no model server.

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
# Only for killpg: a timeout must take the backend's whole process tree down,
# and std can signal one pid. Already in the tree via ureq, so this costs no
# extra compilation.
libc = "0.2"
