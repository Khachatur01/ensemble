[package]
name = "ensemble"
version = "0.1.0"
edition = "2024"
description = "A team of coding agents (Claude Code, OpenCode) behind one MCP server."
license = "MIT"

[[bin]]
name = "ensemble"
path = "src/main.rs"

[dependencies]
# Config and wire formats. serde_norway is the maintained fork of serde_yaml,
# which upstream deprecated.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
# Blocking HTTP client for `health`, which asks an LLM backend which models it
# serves. Chosen over reqwest so the whole program stays synchronous: no async
# runtime is pulled in for one request.
ureq = "3"

[dev-dependencies]
# Nothing. The test suites use the std harness and shell scripts standing in for
# the agent CLIs, so `cargo test` needs no network, model server or agent CLI.

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
# killpg: a time limit or a cancel must take an agent CLI's whole process tree
# down, and std can signal one pid. Already in the tree via ureq, so this costs
# no extra compilation.
libc = "0.2"
