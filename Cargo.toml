[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Khachatur01/ensemble"
rust-version = "1.85"

[workspace.dependencies]
# Config and wire formats. serde_norway is the maintained fork of serde_yaml,
# which upstream deprecated.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
# Blocking HTTP client for `health` and the `direct` adapter. Chosen over
# reqwest so the whole program stays synchronous: no async runtime is pulled in
# for one request.
ureq = "3"
# killpg: a time limit or a cancel must take an agent CLI's whole process tree
# down, and std can signal one pid. Already in the tree via ureq, so this costs
# no extra compilation.
libc = "0.2"
# The link between a node and a hub server: one WebSocket, synchronous like
# the rest, TLS through rustls, which ureq already brings.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Hashing hub tokens and making new ones; already in the tree through rustls.
ring = "0.17"
ensemble-core = { path = "crates/ensemble-core" }
ensemble-config = { path = "crates/ensemble-config" }
ensemble-backends = { path = "crates/ensemble-backends" }
ensemble-knowledge = { path = "crates/ensemble-knowledge" }
ensemble-link = { path = "crates/ensemble-link" }
ensemble-agents = { path = "crates/ensemble-agents" }
ensemble-tasks = { path = "crates/ensemble-tasks" }
ensemble-inbox = { path = "crates/ensemble-inbox" }
ensemble-mcp = { path = "crates/ensemble-mcp" }

[package]
name = "ensemble"
version.workspace = true
edition.workspace = true
description = "A helper team of coding agents (Claude Code, OpenCode, Codex) behind one MCP server."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "agents", "claude-code", "opencode", "codex"]
categories = ["command-line-utilities", "development-tools"]
rust-version.workspace = true

[[bin]]
name = "ensemble"
path = "src/main.rs"

[dependencies]
ensemble-agents.workspace = true
ensemble-backends.workspace = true
ensemble-config.workspace = true
ensemble-core.workspace = true
ensemble-inbox.workspace = true
ensemble-knowledge.workspace = true
ensemble-link.workspace = true
ensemble-mcp.workspace = true
ensemble-tasks.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
ureq.workspace = true

[dev-dependencies]
# Only the test helpers of the workspace's own crates. The suites use the std
# harness and shell scripts standing in for the agent CLIs, so `cargo test`
# needs no network, model server or agent CLI.
ensemble-agents = { workspace = true, features = ["test-support"] }
ensemble-core = { workspace = true, features = ["test-support"] }

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Password hashing runs 600 000 PBKDF2 rounds; unoptimized, the tests would
# spend minutes in it.
[profile.dev.package.ring]
opt-level = 3
