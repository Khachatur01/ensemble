[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Khachatur01/ensemble"
rust-version = "1.92"

[workspace.dependencies]
# Config and wire formats. serde_norway is the maintained fork of serde_yaml,
# which upstream deprecated.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
# Blocking HTTP client for short requests from code that may block: `health`,
# the `direct` adapter (on a blocking thread), the CLI's calls to a hub.
ureq = "3"
# The command line: its commands, each with its own help, typo suggestions,
# and completions for the shells.
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4"
# Async HTTP for what streams for long: a node's model calls. Already in the
# tree through harness-rs, with these features.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# killpg: a time limit or a cancel must take an agent CLI's whole process tree
# down, and std can signal one pid. Already in the tree via ureq, so this costs
# no extra compilation.
libc = "0.2"
# The link between a node and a hub server: one WebSocket on tokio, TLS through
# rustls, which ureq already brings.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# The hub server's accounts and task deliveries: Turso, the Rust rewrite of
# SQLite, embedded and async. Pinned exactly: it is young, and its API moves
# between releases.
turso = { version = "=0.8.3", default-features = false }
# Hashing hub tokens and making new ones; already in the tree through rustls.
ring = "0.17"
# The async runtime. Agents, the link and the node run on it; harness-rs, the
# built-in agent's loop, is async too.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "signal", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"
# Running many futures of one task at once, borrowing what the task holds:
# the tool calls of a session, the runs of a queue.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The `builtin` adapter: an agent loop, its tools and model clients, in this
# binary, so an agent on an LLM backend needs no CLI installed. Pinned exactly:
# it is young, and its API moves between releases.
harness-rs = "=0.0.72"
harness-rs-loop = "=0.0.72"
harness-rs-models = "=0.0.72"
harness-rs-tools = "=0.0.72"
harness-rs-context = "=0.0.72"
ensemble-core = { path = "crates/ensemble-core" }
ensemble-ops = { path = "crates/ensemble-ops" }
ensemble-config = { path = "crates/ensemble-config" }
ensemble-backends = { path = "crates/ensemble-backends" }
ensemble-store = { path = "crates/ensemble-store" }
ensemble-knowledge = { path = "crates/ensemble-knowledge" }
ensemble-link = { path = "crates/ensemble-link" }
ensemble-agents = { path = "crates/ensemble-agents" }
ensemble-tasks = { path = "crates/ensemble-tasks" }
ensemble-inbox = { path = "crates/ensemble-inbox" }
ensemble-mcp = { path = "crates/ensemble-mcp" }
ensemble-node = { path = "crates/ensemble-node" }

[package]
name = "ensemble"
version.workspace = true
edition.workspace = true
description = "An agentic development system: a hub of services (task tracking, knowledge, integrations) and nodes of computing power (agents, model servers), reached over MCP."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "agents", "claude-code", "opencode", "codex"]
categories = ["command-line-utilities", "development-tools"]
rust-version.workspace = true

[[bin]]
name = "ensemble"
path = "src/main.rs"

[dependencies]
ensemble-agents.workspace = true
ensemble-backends.workspace = true
ensemble-config.workspace = true
ensemble-core.workspace = true
ensemble-inbox.workspace = true
ensemble-knowledge.workspace = true
ensemble-link.workspace = true
ensemble-mcp.workspace = true
ensemble-node.workspace = true
ensemble-ops.workspace = true
ensemble-tasks.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
ureq.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true

[dev-dependencies]
# Only the test helpers of the workspace's own crates. The suites use the std
# harness and shell scripts standing in for the agent CLIs, so `cargo test`
# needs no network, model server or agent CLI.
ensemble-agents = { workspace = true, features = ["test-support"] }
ensemble-core = { workspace = true, features = ["test-support"] }

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Password hashing runs 600 000 PBKDF2 rounds; unoptimized, the tests would
# spend minutes in it.
[profile.dev.package.ring]
opt-level = 3
