[package]
name = "ensemble-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ensemble's agents: the CLI adapters, the direct adapter, worktrees, gates and the router that runs an agent once."

[features]
# Test helpers other crates' tests build on, such as a git repository with a commit.
test-support = ["ensemble-core/test-support"]

[dependencies]
ensemble-backends.workspace = true
ensemble-config.workspace = true
ensemble-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
harness-rs.workspace = true
harness-rs-loop.workspace = true
harness-rs-models.workspace = true
harness-rs-tools.workspace = true
harness-rs-context.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
ensemble-backends = { workspace = true, features = ["test-support"] }
ensemble-core = { workspace = true, features = ["test-support"] }
