# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/hub.schema.json

# A hub's settings, written by `ensemble-hub init` in its database,
# database.db in ~/.config/ensemble/hub/, and changed with `ensemble-hub …`
# (`config edit` for the whole of them), its REST API or a web UI. Run it with
# `ensemble-hub serve`. A hub may serve a team, or one person on
# their own computer. Its core is its accounts, their roles and what each may
# do; the port it listens on; and the LLM backends it uses. Everything else
# reaches it through a connector: the REST API, MCP for client agents, the
# runners' link, knowledge, tasks and sources. Every connector is always on,
# and each is written here; some hold adapters you pick, such as the trackers
# of `tasks`. `ensemble-hub …` on this computer is always on too, and has no
# settings.
#
# API keys never go here: a backend names the variable that holds its key.
# `ensemble-hub backend key` keeps a key under a variable of its own, sealed
# in the database by master.key; a key a secrets manager keeps comes from the
# environment, or from a file passed with --env-file. Accounts are not here
# either: `ensemble-hub user`, or the REST API under /api/v1/.
#
# Nothing has a default value: every setting is written here, and one that is
# missing is refused by name. Only these may be left out, because leaving them
# out means "not used": `llm.runners`, `connectors.knowledge.embed`, and
# a backend's `api_key_env`. A map of adapters may be empty: `{}`.
# Check them with `ensemble-hub check`.

version: 1

# The hub's name, such as the organization or the person who runs it.
owner: Acme

# ---------------------------------------------------------------------------
# The port every connector over HTTP is served on: the REST API at /api/v1/,
# MCP at /mcp, and the runners' link at /link and /relay. Put a TLS reverse
# proxy in front for the internet, or listen on a LAN or VPN address.
# ---------------------------------------------------------------------------
http:
  listen: 127.0.0.1:7700

# ---------------------------------------------------------------------------
# LLM backends the hub uses, such as for distilling knowledge. A name is unique
# across both groups, and is all that a connector names.
# ---------------------------------------------------------------------------
llm:
  direct:                        # backends the hub calls itself
    backends:
      central:
        type: openai-compatible-api
        base_url: http://127.0.0.1:8000/v1
        api_key_env: CENTRAL_API_KEY   # left out when the server wants no key
        timeout_seconds: 300
      claude:
        type: anthropic-api
        base_url: https://api.anthropic.com
        api_key_env: ANTHROPIC_API_KEY  # the variable that holds the key, never the key
        timeout_seconds: 120
  # Backends runners offer (`shares` in their runner.yaml), which the hub calls
  # through their links; it never learns their address or key. Whoever runs
  # that runner sees what is sent to it. `ensemble-hub runner backends` lists
  # what runners offer now. Leave this block out for none.
  runners:
    backends:
      gpu:
        runner: ana/gpu-box        # <owner>/<name>, as the hub knows the runner
        backend: local             # its name in that runner's llm.direct

# ---------------------------------------------------------------------------
# Accounts: how people join and sign in, and what each role may do. The first
# admin: `ensemble-hub user add NAME --role admin`.
# ---------------------------------------------------------------------------
accounts:
  registration:
    type: approval               # anyone may sign up; an admin approves. Or: { type: closed }
    max_pending: 20              # sign-ups waiting at once
  sessions:
    hours: 12                    # how long a login lasts
  lockout:
    failures: 5                  # failed logins before a name is refused
    minutes: 15                  # and for how long
  roles:                         # names are yours
    # Permissions: share, recall, tasks, admin; compute (your tasks may be worked
    # on by others' runners that work for the hub, and your runners use the
    # backends they share) and host (connect a runner that works for the hub, for
    # those with compute).
    admin: [admin, share, recall, tasks, compute, host]
    member: [share, recall, tasks, compute]
    reader: [recall]

# ---------------------------------------------------------------------------
# Connectors: everything that reaches the hub. Each is always on.
# ---------------------------------------------------------------------------
connectors:
  rest: {}                       # the REST API at /api/v1/, for scripts and a web UI
  mcp: {}                        # MCP at /mcp, for client agents, an account's token as the API key
  runners: {}                    # the runners' link at /link and /relay: tasks, and backends they share

  # Knowledge: the hub's vault. What members share becomes notes here.
  knowledge:
    vault: vault
    # The embedding model: each note's vector when it is written, so the
    # distiller and recall find notes by what they mean as well as by their
    # words. One an openai-compatible backend serves at /embeddings. Left out:
    # by their words alone, as when the model cannot be asked.
    embed:
      backend: central
      model: nomic-embed-text
      min_similarity: 0.5        # how alike a note must be, by cosine; depends on the model
    distill:                     # the models that turn shares into notes, with no tools
      try:                       # in order; a share uses the first that works
        - backend: central
          model: qwen3.5-72b
        - backend: gpu
          model: qwen3.5:9b
        - backend: claude
          model: claude-haiku-4-5
      when_none: wait            # or fail: the share goes to review/ with why
      max_tokens: 4000
    recall:
      max_notes: 8
      max_chars: 6000

  # Tasks: the tasks the hub keeps, made by client agents over MCP and by the
  # trackers named here. An issue with a tracker's label reaches the helper
  # team of the member it is assigned to. An account names itself in the
  # tracker with `tracker_user` (PUT /api/v1/me, or `ensemble-hub user
  # tracker`). Each tracker has an inbox and a folder of its own; `trackers:
  # {}` for no inbox.
  tasks:
    trackers:
      issues:
        type: local_markdown
        dir: issues              # on this server; often a git repo the team shares
        label: ensemble
        poll_seconds: 30

  # Sources: knowledge brought in from outside, such as a mailbox or a chat.
  # One model collects what every source brings in, keeping what is worth
  # knowing, then removes what `prompt` calls confidential; only that is
  # shared, for the whole hub, and the raw messages are dropped. Leave
  # `filter` out to connect no source. `ensemble-hub source try` shows what a
  # text would leave. No source adapter is built yet.
  sources:
    filter:
      try:                       # in order; the first that works is used
        - backend: central
          model: qwen3.5-72b
      when_none: wait            # or fail: what was brought in is dropped, saying why
      max_tokens: 2000
      prompt: >-
        Salaries, contracts and prices agreed with clients; clients' and
        candidates' names and contact details; anything about a person's
        health or family.
    adapters: {}
