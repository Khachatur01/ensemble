# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/hub.schema.json

# hub.yaml — a hub, written by `ensemble hub init` in ~/.config/ensemble/hub/.
# Run it with `ensemble hub serve`. A hub provides services and connects nodes:
# it has no helper team and runs no agents. Nodes connect to it (each names it
# as `hub:` in its node.yaml): their agents share to and recall from the
# knowledge vault here, the issues assigned to their owners in the tracker reach
# their helper teams, and shared nodes lend their power through it. It may serve
# a team, or one person on their own computer. API keys never go here: they come
# from the environment, or from a file passed with --env-file. Accounts are not
# here either: they are kept in database.db beside it (`ensemble hub user`, or
# the REST API under /api/v1/).
#
# Nothing has a default value: every setting is written here, and one that is
# missing is refused by name. Only these may be left out, because leaving them
# out means "not used": `tasks`, and a backend's `api_key_env`.
# Check the file with `ensemble hub check`.

version: 1

# The hub's name, such as the organization or the person who runs it.
owner: Acme

# ---------------------------------------------------------------------------
# LLM backends the hub itself uses, such as for distilling knowledge.
# ---------------------------------------------------------------------------
llm_backends:
  central:
    type: openai-compatible-api
    base_url: http://127.0.0.1:8000/v1
    api_key_env: CENTRAL_API_KEY   # left out when the server wants no key
    timeout_seconds: 300
  claude:
    type: anthropic-api
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY  # the variable that holds the key, never the key
    timeout_seconds: 120

# ---------------------------------------------------------------------------
# Knowledge: the hub's vault. What members share becomes notes here.
# ---------------------------------------------------------------------------
knowledge:
  vault: vault
  distill:                       # the models that turn shares into notes, with no tools
    try:                         # in order; a share uses the first that works
      - backend: central
        model: qwen3.5-72b
      - backend: claude
        model: claude-haiku-4-5
    when_none: wait              # or fail: the share goes to review/ with why
    max_tokens: 4000
  recall:
    max_notes: 8
    max_chars: 6000
    # Find notes by what they mean as well as by their words, with an embedding
    # model an openai-compatible backend serves at /embeddings. Left out: by
    # their words alone, as when the model cannot be asked.
    embed:
      backend: central
      model: nomic-embed-text
      min_similarity: 0.5        # how alike a note must be, by cosine; depends on the model

# ---------------------------------------------------------------------------
# Tasks: issues in the tracker with the label reach the helper team of the
# member they are assigned to. An account names itself in the tracker with
# `tracker_user` (PUT /api/v1/me, or `ensemble hub user tracker`); each member's
# node takes them into the folder of the project's name where it last ran.
# Leave this block out for no inbox.
# ---------------------------------------------------------------------------
tasks:
  tracker:
    type: local_markdown
    dir: issues                  # on this server; often a git repo the team shares
  label: ensemble
  poll_seconds: 30

# ---------------------------------------------------------------------------
# Server: where it listens for members' computers and the REST API. Put a TLS
# reverse proxy in front for the internet, or listen on a LAN or VPN address.
# ---------------------------------------------------------------------------
server:
  listen: 127.0.0.1:7700         # nodes and the REST API under /api/v1/
  registration:
    type: approval               # anyone may sign up; an admin approves. Or: { type: closed }
    max_pending: 20              # sign-ups waiting at once
  sessions:
    hours: 12                    # how long a login lasts
  lockout:
    failures: 5                  # failed logins before a name is refused
    minutes: 15                  # and for how long
roles:                           # names are yours; the first admin: `ensemble hub user add`
  # Permissions: share, recall, tasks, admin; compute (use shared nodes) and
  # host (connect a shared node that works for those with compute).
  admin: [admin, share, recall, tasks, compute, host]
  member: [share, recall, tasks, compute]
  reader: [recall]

# ---------------------------------------------------------------------------
# Interfaces: how the hub is reached. Left out, the command line alone is on.
# ---------------------------------------------------------------------------
interfaces:
  cli: {}                        # `ensemble hub …` on this computer, run by the running hub
  mcp:                           # MCP for client agents at <url>/mcp, an account's token as the API key
    url: http://127.0.0.1:7700   # the address clients reach the hub at; left out: no MCP
