# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/runner.schema.json

# runner.yaml — this computer's runner: a worker that runs your helper teams,
# every team in its teams directory (`ensemble runner team list` lists them).
# With a hub server you signed in to (`ensemble runner login`), it runs the
# tasks the hub keeps for you in the git repositories of its workspace, and can
# lend this computer's power. Written by `ensemble runner setup` or `ensemble
# runner init` in ~/.config/ensemble/runner. A computer runs one runner.
#
# Nothing has a default value. Each block under `offers` may be left out, which
# means it is not used; `offers: {}` offers nothing.

version: 1

name: laptop                     # its name; a hub knows it as <you>/laptop

# private: it works for you alone. shared: also for everyone whose role on the
# hub has `compute`. A shared runner runs other people's work only on models
# from llm_backends, never on your agent CLI's subscription.
access: private

# The folder it works in. Each git repository directly inside it is a project,
# named for its folder: the runner runs the tasks the hub keeps for it, and
# finds a repository you add within half a minute. ~/ is your home directory.
workspace: ~/ensemble

hub: wss://hub.example.com       # the hub server it connects to (`ensemble runner login` first); leave out for none

offers:
  # Agents of its teams, which others name with an agent of `type: node`. A run
  # sent here gets a copy of the files git tracks, works in a folder of its own,
  # and sends back what it changed; gates, branches and commits stay with
  # whoever sent it.
  runs:
    agents: [web/coder]            # which agents may run here, as <team>/<agent>

  # Models an OpenAI-compatible server here serves, reached through the hub at
  # https://<hub>/nodes/v1 with an access token as the API key.
  models:
    base_url: http://127.0.0.1:11434/v1
    timeout_seconds: 600           # the most one request may take
    names: [qwen3.5:9b]            # the models offered, as the server names them

# How the runner is managed. Left out, the command line is on.
interfaces:
  cli: {}                          # `ensemble runner …` on this computer, run by the running runner
