# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/hub.schema.json

# hub.yaml — a hub server for a team, written by `ensemble hub init --server`.
# Run it with `ensemble hub serve`. Members' computers connect to it: their
# agents share to and recall from the organization's knowledge vault here, and
# the issues assigned to them in the tracker reach their helper teams. API keys
# never go here: they come from the environment, or from a file passed with
# --env-file. Accounts are not here either: they are kept in the hub's state
# (`ensemble hub user`, or the REST API under /api/v1/).
#
# Nothing has a default value: every setting is written here, and one that is
# missing is refused by name. Only these may be left out, because leaving them
# out means "not used": `tasks`, and a backend's `api_key_env`.
# Check the file with `ensemble hub check --hub <dir>`.

version: 1

# Who runs this hub: the organization, named in what it logs.
owner: Acme

# ---------------------------------------------------------------------------
# LLM backends the hub itself uses, such as for distilling knowledge.
# ---------------------------------------------------------------------------
llm_backends:
  central:
    type: openai-compatible-api
    base_url: http://127.0.0.1:8000/v1
    timeout_seconds: 300

# ---------------------------------------------------------------------------
# Knowledge: the organization vault. Members' shares become notes here.
# ---------------------------------------------------------------------------
knowledge:
  vault: vault
  distill:
    try:
      - backend: central
        model: qwen3.5-72b
    when_none: wait
    max_tokens: 4000
  recall:
    max_notes: 8
    max_chars: 6000

# ---------------------------------------------------------------------------
# Tasks: issues in the tracker with the label reach the helper team of the
# member they are assigned to. An account names itself in the tracker with
# `tracker_user` (PUT /api/v1/me, or `ensemble hub user tracker`); each member's
# computer maps projects to folders in its own ~/.config/ensemble/node.yaml.
# Leave this block out for no inbox.
# ---------------------------------------------------------------------------
tasks:
  tracker:
    type: local_markdown
    dir: issues                  # on this server; often a git repo the team shares
  label: ensemble
  poll_seconds: 30

# ---------------------------------------------------------------------------
# Server: where it listens for members' computers and the REST API. Put a TLS
# reverse proxy in front for the internet, or listen on a LAN or VPN address.
# ---------------------------------------------------------------------------
server:
  listen: 127.0.0.1:7700         # nodes and the REST API under /api/v1/
  registration:
    type: approval               # anyone may sign up; an admin approves. Or: { type: closed }
    max_pending: 20              # sign-ups waiting at once
  sessions:
    hours: 12                    # how long a login lasts
  lockout:
    failures: 5                  # failed logins before a name is refused
    minutes: 15                  # and for how long
roles:                           # names are yours; the first admin: `ensemble hub user add`
  admin: [admin, share, recall, tasks]
  member: [share, recall, tasks]
  reader: [recall]
