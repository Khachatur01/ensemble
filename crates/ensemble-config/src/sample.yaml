# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/ensemble.schema.json

# config.yaml — a helper team of agents, written by `ensemble-runner team new`.
# It lives in a folder of its own (often its own git repo), apart from any
# project; the repository a task names is where the team works. It can be yours
# alone, or one your company shares and you pull. API keys never go here: they
# come from the environment, or from a file passed with --env-file.
#
# Nothing has a default value: every setting is written here, and one that is
# missing is refused by name. Only a few may be left out, because leaving them
# out means "not used": an agent's `prompt`, and a backend's `api_key_env`.
# This file is a map of what can be set rather than a team to keep as it is:
# delete the agents you do not want and change the rest. Check it with
# `ensemble-runner team check`, see how an agent is started with
# `ensemble-runner agent show <team>/<agent>`, and check that everything it
# needs is there with `ensemble-runner agent health`.
#
# Your runner runs every team in its teams directory, where `ensemble-runner
# team new` writes this; the tasks of your hub go to `<team>/<agent>`.

version: 1

# ---------------------------------------------------------------------------
# LLM backends: model endpoints, such as a local model server. An agent names
# one with a model of type `llm_backend`, and Ensemble hands its CLI the
# endpoint and key for each run, so they are set here and nowhere else. `{}`
# when there are none.
# ---------------------------------------------------------------------------
llm_backends:
  local:
    # Any POST /chat/completions endpoint: llama-server, vLLM, Ollama,
    # Unsloth, a hosted API.
    type: openai-compatible-api
    # Where the endpoint is. This is Ollama's.
    base_url: "http://127.0.0.1:11434/v1"
    # The NAME of the variable holding the API key. Keys never go in here.
    # Leave it out when the endpoint wants none.
    api_key_env: OPENAI_LOCAL_API_KEY
    # Seconds one request may take.
    timeout_seconds: 600
  # A bigger model server your company runs, shared by everyone's agents.
  central:
    type: openai-compatible-api
    base_url: "https://llm.example.com/v1"
    api_key_env: CENTRAL_LLM_API_KEY
    timeout_seconds: 600
  # Anthropic's own API. Only a `direct` agent can run on it.
  claude-api:
    type: anthropic-api
    # Where the API is, without /v1.
    base_url: "https://api.anthropic.com"
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 120

# ---------------------------------------------------------------------------
# Limits that agents share. Two agents on one model server, or on one
# subscription, should not each assume they have it to themselves: an agent
# names a limit with `limit`, in place of its own `max_concurrent` and `budget`,
# and every agent that names it uses one count of slots and one budget. `{}` when
# there are none.
# ---------------------------------------------------------------------------
limits:
  local-server:
    # Most runs at once across all of them.
    max_concurrent: 1
    # How much all of them together may run in an hour: `unlimited`, `per_hour`
    # with `delegations`, or `per_hour_tokens` with `tokens`, counted from what
    # each run reports (one that reports none counts none).
    budget:
      type: per_hour_tokens
      tokens: 2000000

# ---------------------------------------------------------------------------
# Gates: checks a task's work must pass. None here; `{}` says there are none.
# To add one, give it a name and a command:
#
#   gates:
#     test:
#       # Run with sh -c in the task's working directory; exit status 0 passes.
#       command: make test
#       # Seconds it may run before it is stopped and counts as failed.
#       timeout_seconds: 900
#
# A task then names it with `gate: { name: test, attempts: 3 }`; when the
# command fails, the same agent tries again with its output, up to `attempts`
# runs in all. Commands live here, not in tasks, so a task cannot bring a
# command of its own.
# ---------------------------------------------------------------------------
gates: {}

# ---------------------------------------------------------------------------
# Agents: the helper team, one professional each. The names are yours; a task
# names its agent, and the first line of each `prompt` says what it is for.
# Each runs an agent CLI you have installed, headless in the task's repository,
# or makes one request to a model.
# ---------------------------------------------------------------------------
agents:
  # The OpenCode CLI on a model from llm_backends.
  coder:
    # What it is for. The first line is what the hub lists among its agents;
    # the whole of it is the agent's system prompt. Leave it out for no system
    # prompt.
    prompt: |
      You implement exactly what is asked, in the style of the surrounding
      code. Read the relevant files first, make the change, and report what
      you changed.
    # Wall-clock limit for one run.
    max_seconds: 1800
    # Its slots and budget come from a shared limit above, in place of its own
    # `max_concurrent` and `budget`.
    limit: local-server
    # Where its tasks run: `shared` in the project, or `worktree`, each task in
    # its own git worktree on the branch ensemble/<id>, committed there and
    # never merged by Ensemble.
    isolation: worktree
    adapter:
      type: opencode
      # Where the model comes from: `llm_backend` for one an entry of
      # llm_backends serves, `provider` for one OpenCode is already set up for.
      model:
        type: llm_backend
        # The models it may run on, in order. Each run uses the first whose
        # backend answers and serves it, so the agent keeps working when your
        # own server is off. With one model, it is simply used.
        try:
          - backend: local
            # The id the endpoint serves the model under, as its /models lists it.
            name: qwen3.5:9b
            # Tokens of context the server really runs the model with, so
            # OpenCode knows when to compact (Ollama: OLLAMA_CONTEXT_LENGTH).
            context_window: 32768
          - backend: central
            name: qwen3.5:72b
            context_window: 131072
        # When none of them can be used: `fail` (say what each backend
        # answered) or `wait` (a task waits in the queue and is tried again).
        when_none: wait
      # OpenCode permissions, such as read, edit, bash or bash(git *);
      # everything else is denied.
      tools: [read, glob, grep, list, edit, bash]
      system_prompt: append
      max_steps: 30
      # The CLI: `opencode` if it is on PATH.
      command: opencode

  # The OpenCode CLI on a provider OpenCode is already set up for.
  explorer:
    prompt: |
      You find where things are in the codebase and report file:line with a
      one-line note each. You do not edit.
    max_seconds: 1800
    # Most runs of it at once; more tasks wait for a free slot.
    # 1 suits a model server that serves one request at a time.
    max_concurrent: 1
    isolation: shared
    # How many runs it may start in an hour: `unlimited`, or `per_hour` with
    # `delegations` (tasks and gate retries both count).
    budget:
      type: unlimited
    adapter:
      type: opencode
      model:
        type: provider
        # provider/model, as `opencode models` lists it.
        name: opencode/big-pickle
      # Read-only.
      tools: [read, glob, grep, list]
      system_prompt: append
      max_steps: 30
      command: opencode

  # A light agent: one request straight to a model from llm_backends. No CLI
  # and no tools, so it reads and changes nothing and answers from what it is
  # given: cheap work such as summarising, classifying or drafting.
  summariser:
    prompt: |
      You summarise what you are given in five bullet points or fewer.
    max_seconds: 600
    max_concurrent: 1
    isolation: shared
    budget:
      type: unlimited
    adapter:
      type: direct
      # The models it may run on, in order, as for `coder` above.
      try:
        - backend: local
          # The id the endpoint serves the model under, as its /models lists it.
          model: qwen3.5:9b
      when_none: fail
      # Most tokens of answer; an answer cut off there is marked unfinished.
      max_tokens: 1000

  # An agent loop in Ensemble itself, on a model from llm_backends: it reads,
  # edits and runs commands with the tools listed, so no agent CLI needs
  # installing. What OpenCode on an LLM backend does, with nothing to install.
  patcher:
    prompt: |
      You fix small, well-described bugs. Read the code before changing it,
      change as little as you can, and say what you changed.
    max_seconds: 1800
    max_concurrent: 1
    isolation: worktree
    budget:
      type: per_hour
      delegations: 20
    adapter:
      type: builtin
      # The models it may run on, in order, as for `coder` above.
      try:
        - backend: local
          model: qwen3-coder:30b
          # Tokens of context the server runs the model with; the loop
          # compacts the conversation before it outgrows them.
          context_window: 65536
      when_none: fail
      # read, list, grep and glob only look; write and edit change files;
      # shell runs any command in the working directory.
      tools: [read, list, grep, glob, edit, write, shell]
      # Most model calls for one run.
      max_steps: 40
      # Most tokens of answer per model call.
      max_tokens: 4000

  # An agent a runner of a hub server offers, such as a colleague's shared runner
  # on a machine with big GPUs. The task and a copy of the files git tracks go
  # there; what the agent changed comes back and is written here, where gates,
  # branches and commits stay. Needs `ensemble-runner login <hub>`.
  heavy-coder:
    prompt: |
      Implements large changes on a big model.
    max_seconds: 3600
    max_concurrent: 1
    isolation: worktree
    budget:
      type: unlimited
    adapter:
      type: node
      hub: wss://hub.example.com
      # The agent the runners offer, by its name in their helper team.
      agent: coder
      # The runners that may run it, as <owner>/<name>, tried in order;
      # `ensemble-runner peers` lists them.
      nodes: [kim/gpu-box]

  # The Codex CLI, on your own login.
  fixer:
    prompt: |
      You fix exactly what is asked and say what you changed.
    max_seconds: 1800
    max_concurrent: 1
    isolation: worktree
    budget:
      type: unlimited
    adapter:
      type: codex
      model: gpt-5-codex
      # Codex's own sandbox, which is what limits it: read-only,
      # workspace-write (it may change files here) or danger-full-access.
      sandbox: workspace-write
      # The CLI: `codex` if it is on PATH.
      command: codex

  # The Claude Code CLI, on your own subscription.
  reviewer:
    prompt: |
      You review code for correctness and report findings as
      file:line — problem — fix. You do not rewrite the code.
    max_seconds: 1800
    max_concurrent: 1
    isolation: shared
    budget:
      type: per_hour
      delegations: 20
    adapter:
      type: claude-code
      # An alias (sonnet, opus, haiku) or a full model id.
      model: sonnet
      # Claude Code's own tools, one per entry, such as Read, Edit, Bash or
      # Bash(git diff:*). This is read-only.
      tools: [Read, Grep, Glob]
      # dontAsk denies anything not in tools instead of waiting for a person.
      permission_mode: dontAsk
      max_turns: 30
      # The CLI: `claude` if it is on PATH.
      command: claude
