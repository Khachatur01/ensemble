# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/node.schema.json

# node.yaml — this computer's node: a worker that runs your helper teams, every
# team in its teams directory (`ensemble node team list` lists them).
# Your agent CLI reaches it from any folder through `ensemble mcp`, and its
# tasks go on after the session ends. With a hub server you signed in to
# (`ensemble node login`), it also runs the tasks the hub keeps for you and can
# lend this computer's power. Written by `ensemble node setup` or `ensemble node init` in
# ~/.config/ensemble. A computer runs one node.
#
# Nothing has a default value. Each block under `offers` may be left out, which
# means it is not used; `offers: {}` offers nothing.

version: 1

name: laptop                     # its name; a hub knows it as <you>/laptop

# private: it works for you alone. shared: also for everyone whose role on the
# hub has `compute`. A shared node runs other people's work only on models from
# llm_backends, never on your agent CLI's subscription.
access: private

hub: wss://hub.example.com       # the hub server it connects to (`ensemble node login` first); leave out for none

offers:
  # Agents of its teams, which others name with an agent of `type: node`. A task
  # sent here gets a copy of the files git tracks, works in a folder of its own,
  # and sends back what it changed; gates, branches and commits stay with
  # whoever sent it.
  runs:
    agents: [web/coder]            # which agents may run here, as <team>/<agent>

  # Models an OpenAI-compatible server here serves, reached through the hub at
  # https://<hub>/nodes/v1 with an access token as the API key.
  models:
    base_url: http://127.0.0.1:11434/v1
    timeout_seconds: 600           # the most one request may take
    names: [qwen3.5:9b]            # the models offered, as the server names them
