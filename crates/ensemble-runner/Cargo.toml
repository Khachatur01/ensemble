serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures-util.workspace = true
clap.workspace = true
clap_complete.workspace = true

[dev-dependencies]
ensemble-agents = { workspace = true, features = ["test-support"] }
ensemble-core = { workspace = true, features = ["test-support"] }
