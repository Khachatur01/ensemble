# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/ensemble.schema.json

# .ensemble/config.yaml — the agent team for this project, written by
# `ensemble init`. API keys go in .env beside it, which git ignores.
#
# Every setting is here at least once, most of them at their default, so this
# is a map of what can be set rather than a team to keep as it is: delete the
# agents you do not want and change the rest. Check it with `ensemble check`,
# see how an agent is started with `ensemble show <agent>`, and check that
# everything it needs is there with `ensemble health`.
#
# Register Ensemble with your agent from this directory, which makes your
# agent the manager of the team:
#   claude mcp add --scope local ensemble -- ensemble mcp
#   opencode mcp add ensemble -- ensemble mcp

version: 1

# ---------------------------------------------------------------------------
# LLM backends: model endpoints, such as a local model server. An agent names
# one with `llm_backend`, and Ensemble hands its CLI the endpoint and key for
# each run, so they are set here and nowhere else.
# ---------------------------------------------------------------------------
llm_backends:
  local:
    # Any POST /chat/completions endpoint: llama-server, vLLM, Ollama,
    # Unsloth, a hosted API.
    type: openai-compatible-api
    # The NAME of the variable holding the base URL, not the URL itself.
    base_url_env: OPENAI_LOCAL_BASE_URL
    # Used when that variable is unset or empty. This is Ollama's.
    base_url_default: "http://127.0.0.1:11434/v1"
    # The NAME of the variable holding the API key. Keys never go in here.
    api_key_env: OPENAI_LOCAL_API_KEY
    # Seconds one request may take.
    timeout_seconds: 600

# ---------------------------------------------------------------------------
# Agents: the team. The names are yours; your agent delegates by name. Each
# runs an agent CLI you have installed, headless in this project.
# ---------------------------------------------------------------------------
agents:
  # The OpenCode CLI on a model from llm_backends.
  coder:
    # What it is for. The first line is what your agent sees in `agents`; the
    # whole of it is the agent's system prompt.
    prompt: |
      You implement exactly what is asked, in the style of the surrounding
      code. Read the relevant files first, make the change, and report what
      you changed.
    # Tokens of context the server really runs the model with. Required on an
    # llm_backend, so OpenCode knows when to compact (Ollama:
    # OLLAMA_CONTEXT_LENGTH).
    context_window: 32768
    # Wall-clock limit for one delegation.
    max_seconds: 1800
    adapter:
      type: opencode
      llm_backend: local
      # The id the endpoint serves the model under, as its /models lists it.
      model: qwen3.5:9b
      # OpenCode permissions, such as read, edit, bash or bash(git *);
      # everything else is denied.
      tools: [read, glob, grep, list, edit, bash]
      max_steps: 30
      # The CLI, if it is not `opencode` on PATH.
      command: opencode

  # The OpenCode CLI on a provider OpenCode is already set up for.
  explorer:
    prompt: |
      You find where things are in the codebase and report file:line with a
      one-line note each. You do not edit.
    adapter:
      type: opencode
      # provider/model, as `opencode models` lists it.
      model: opencode/big-pickle
      # This is the default: read-only.
      tools: [read, glob, grep, list]

  # The Claude Code CLI, on your own subscription.
  reviewer:
    prompt: |
      You review code for correctness and report findings as
      file:line — problem — fix. You do not rewrite the code.
    max_seconds: 1800
    adapter:
      type: claude-code
      # An alias (sonnet, opus, haiku) or a full model id.
      model: sonnet
      # Claude Code's own tools, one per entry, such as Read, Edit, Bash or
      # Bash(git diff:*). This is the default: read-only.
      tools: [Read, Grep, Glob]
      # dontAsk denies anything not in tools instead of waiting for a person.
      permission_mode: dontAsk
      max_turns: 30
      # The CLI, if it is not `claude` on PATH.
      command: claude
