# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/ensemble.schema.json

# .ensemble/config.yaml — the agent team for this project, written by
# `ensemble init`. API keys go in .env beside it, which git ignores.
#
# Every setting is here at least once, most of them at their default, so this
# is a map of what can be set rather than a team to keep as it is: delete the
# agents you do not want and change the rest. Check it with `ensemble check`.
#
# Register Ensemble with your agent from this directory, which makes your
# agent the manager of the team:
#   claude mcp add --scope local ensemble -- ensemble mcp
#   opencode mcp add ensemble -- ensemble mcp

version: 1

# ---------------------------------------------------------------------------
# LLM backends: model endpoints that agents with the `ensemble` adapter run
# on. Agents with the `claude-code` or `opencode` adapter need none.
# ---------------------------------------------------------------------------
llm_backends:
  local:
    # Any POST /chat/completions endpoint: Ollama, llama-server, vLLM, a
    # hosted API.
    type: openai-compatible-api
    # The NAME of the variable holding the base URL, not the URL itself.
    base_url_env: OPENAI_LOCAL_BASE_URL
    # Used when that variable is unset or empty. This is Ollama's.
    base_url_default: "http://127.0.0.1:11434/v1"
    # The NAME of the variable holding the API key. Keys never go in here.
    api_key_env: OPENAI_LOCAL_API_KEY
    # Seconds one request may take.
    timeout_seconds: 600

# ---------------------------------------------------------------------------
# Agents: the team. The names are yours; your agent delegates by name.
# ---------------------------------------------------------------------------
agents:
  # Ensemble's own agent, running a tool loop in the project on a model from
  # llm_backends.
  coder:
    # What it is for. The first line is what your agent sees in `agents`; the
    # whole of it is the agent's system prompt.
    prompt: |
      You implement exactly what is asked, in the style of the surrounding
      code. Read the relevant files first, make the change, and report what
      you changed.
    # Tokens of context the server really runs the model with. Required for
    # an ensemble agent with tools (Ollama: OLLAMA_CONTEXT_LENGTH).
    context_window: 16384
    # Wall-clock limit for one delegation.
    max_seconds: 1800
    adapter:
      type: ensemble
      llm_backend: local
      model: qwen3.5:9b
      # Sampling, overriding the model's own defaults. A presence penalty
      # pushes the model away from repeating the paths and names tool calls
      # are made of; 0 turns it off.
      temperature: 0.2
      presence_penalty: 0
      frequency_penalty: 0
      # How much a reasoning model thinks first: none, low, medium or high.
      reasoning_effort: none
      # read, glob, grep, edit, write, bash, fetch. edit, write and bash
      # change files. bash is sandboxed: it writes only in the project and
      # /tmp, and reads only the project, the system and toolchains.
      tools: [read, glob, grep, edit, write, bash, fetch]
      # Model calls per delegation.
      max_steps: 20
      # Let bash open outbound TCP connections.
      network: false
      # More paths bash may read, absolute or ~/.
      readable: ["~/.m2"]

  # An ensemble agent without tools: one model call, text back.
  planner:
    prompt: |
      You turn a goal into an ordered plan of small, verifiable steps. State
      what you are unsure about rather than guessing.
    adapter:
      type: ensemble
      llm_backend: local
      model: qwen3.5:9b
      reasoning_effort: high

  # The Claude Code CLI, headless in the project, on your own subscription.
  reviewer:
    prompt: |
      You review code for correctness and report findings as
      file:line — problem — fix. You do not rewrite the code.
    max_seconds: 1800
    adapter:
      type: claude-code
      # An alias (sonnet, opus, haiku) or a full model id.
      model: sonnet
      # Claude Code's own tools, one per entry, such as Read, Edit, Bash or
      # Bash(git diff:*). This is the default: read-only.
      tools: [Read, Grep, Glob]
      # dontAsk denies anything not in tools instead of waiting for a person.
      permission_mode: dontAsk
      max_turns: 30
      # The CLI, if it is not `claude` on PATH.
      command: claude

  # The OpenCode CLI, headless in the project, on any provider it is set up
  # for.
  explorer:
    prompt: |
      You find where things are in the codebase and report file:line with a
      one-line note each. You do not edit.
    max_seconds: 1800
    adapter:
      type: opencode
      # provider/model, as `opencode models` lists it.
      model: opencode/big-pickle
      # OpenCode permissions, such as read, edit, bash or bash(git *);
      # everything else is denied. This is the default: read-only.
      tools: [read, glob, grep, list]
      max_steps: 30
      # The CLI, if it is not `opencode` on PATH.
      command: opencode
