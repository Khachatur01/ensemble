# yaml-language-server: $schema=https://raw.githubusercontent.com/Khachatur01/ensemble/master/ensemble.schema.json

# .ensemble/config.yaml — the agent team for this project, written by
# `ensemble init`. API keys go in .env beside it, which git ignores.
#
# Nothing has a default value: every setting is written here, and one that is
# missing is refused by name. Only two may be left out, because leaving them
# out means "not used": an agent's `prompt` and a backend's `api_key_env`.
# This file is a map of what can be set rather than a team to keep as it is:
# delete the agents you do not want and change the rest. Check it with
# `ensemble check`, see how an agent is started with `ensemble show <agent>`,
# and check that everything it needs is there with `ensemble health`.
#
# Register Ensemble with your agent from this directory, which makes your
# agent the manager of the team:
#   claude mcp add --scope local ensemble -- ensemble mcp
#   opencode mcp add ensemble -- ensemble mcp

version: 1

# ---------------------------------------------------------------------------
# LLM backends: model endpoints, such as a local model server. An agent names
# one with a model of type `llm_backend`, and Ensemble hands its CLI the
# endpoint and key for each run, so they are set here and nowhere else. `{}`
# when there are none.
# ---------------------------------------------------------------------------
llm_backends:
  local:
    # Any POST /chat/completions endpoint: llama-server, vLLM, Ollama,
    # Unsloth, a hosted API.
    type: openai-compatible-api
    # Where the endpoint is. This is Ollama's.
    base_url: "http://127.0.0.1:11434/v1"
    # The NAME of the variable holding the API key. Keys never go in here.
    # Leave it out when the endpoint wants none.
    api_key_env: OPENAI_LOCAL_API_KEY
    # Seconds one request may take.
    timeout_seconds: 600

# ---------------------------------------------------------------------------
# Gates: commands a task's work must pass. A task names one with
# `gate: { name: test, attempts: 3 }`; when the command fails, the same agent
# tries again with its output, up to `attempts` runs in all. Commands live
# here, not in tasks, so a task cannot bring a command of its own. `{}` when
# there are none.
# ---------------------------------------------------------------------------
gates:
  test:
    # Run with sh -c in the task's working directory; exit status 0 passes.
    command: make test
    # Seconds it may run before it is stopped and counts as failed.
    timeout_seconds: 900

# ---------------------------------------------------------------------------
# Agents: the team. The names are yours; your agent delegates by name. Each
# runs an agent CLI you have installed, headless in this project.
# ---------------------------------------------------------------------------
agents:
  # The OpenCode CLI on a model from llm_backends.
  coder:
    # What it is for. The first line is what your agent sees in `agents`; the
    # whole of it is the agent's system prompt. Leave it out for no system
    # prompt.
    prompt: |
      You implement exactly what is asked, in the style of the surrounding
      code. Read the relevant files first, make the change, and report what
      you changed.
    # Wall-clock limit for one delegation.
    max_seconds: 1800
    # Most delegations to it that run at once; more wait for a free slot.
    # 1 suits a model server that serves one request at a time.
    max_concurrent: 1
    # Where its tasks run: `shared` in the project, or `worktree`, each task in
    # its own git worktree on the branch ensemble/<id>, committed there and
    # never merged by Ensemble.
    isolation: worktree
    # How many runs it may start in an hour: `unlimited`, or `per_hour` with
    # `delegations` (tasks, gate retries and delegations all count).
    budget:
      type: unlimited
    adapter:
      type: opencode
      # Where the model comes from: `llm_backend` for one an entry of
      # llm_backends serves, `provider` for one OpenCode is already set up for.
      model:
        type: llm_backend
        backend: local
        # The id the endpoint serves the model under, as its /models lists it.
        name: qwen3.5:9b
        # Tokens of context the server really runs the model with, so OpenCode
        # knows when to compact (Ollama: OLLAMA_CONTEXT_LENGTH).
        context_window: 32768
      # OpenCode permissions, such as read, edit, bash or bash(git *);
      # everything else is denied.
      tools: [read, glob, grep, list, edit, bash]
      max_steps: 30
      # The CLI: `opencode` if it is on PATH.
      command: opencode

  # The OpenCode CLI on a provider OpenCode is already set up for.
  explorer:
    prompt: |
      You find where things are in the codebase and report file:line with a
      one-line note each. You do not edit.
    max_seconds: 1800
    max_concurrent: 1
    isolation: shared
    budget:
      type: unlimited
    adapter:
      type: opencode
      model:
        type: provider
        # provider/model, as `opencode models` lists it.
        name: opencode/big-pickle
      # Read-only.
      tools: [read, glob, grep, list]
      max_steps: 30
      command: opencode

  # The Claude Code CLI, on your own subscription.
  reviewer:
    prompt: |
      You review code for correctness and report findings as
      file:line — problem — fix. You do not rewrite the code.
    max_seconds: 1800
    max_concurrent: 1
    isolation: shared
    budget:
      type: per_hour
      delegations: 20
    adapter:
      type: claude-code
      # An alias (sonnet, opus, haiku) or a full model id.
      model: sonnet
      # Claude Code's own tools, one per entry, such as Read, Edit, Bash or
      # Bash(git diff:*). This is read-only.
      tools: [Read, Grep, Glob]
      # dontAsk denies anything not in tools instead of waiting for a person.
      permission_mode: dontAsk
      max_turns: 30
      # The CLI: `claude` if it is on PATH.
      command: claude
